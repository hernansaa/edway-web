{% extends "marketing/base.html" %}

{% block extra_head %}
<meta name="robots" content="noindex, nofollow">
{% endblock %}

{% block content %}

<section style="padding:72px 0 80px;background:var(--bg);">
    <div style="max-width:1152px;margin:0 auto;padding:0 24px;">
        <p class="edway-label" style="margin-bottom:14px;">Test</p>
        <h1 style="font-size:clamp(32px,4vw,52px);font-weight:700;letter-spacing:-0.04em;line-height:1.1;color:var(--text-heading);max-width:520px;margin-bottom:16px;">
            Lead form embed test.
        </h1>
        <p style="font-size:17px;color:var(--text-body);max-width:460px;line-height:1.75;margin-bottom:48px;">
            Test page for the Edway lead form iframe embed.
        </p>

        <!-- EdWay lead form (iframe — recommended) -->
        <iframe id="edway-form-6b961f4b-628d-4dbd-8504-7b4c0488ac1d" src="https://edway.app/embed/6b961f4b-628d-4dbd-8504-7b4c0488ac1d/" title="Contact form"
                width="100%" height="620" style="border:0;overflow:hidden"
                scrolling="no" loading="lazy"></iframe>
    </div>
</section>

{% endblock %}

{% block extra_js %}
<script>
  (function () {
    var frame = document.getElementById("edway-form-6b961f4b-628d-4dbd-8504-7b4c0488ac1d");
    if (!frame) return;
    window.addEventListener("message", function (event) {
      var data = event.data || {};
      if (data.type === "edway-embed-resize" && data.token === "6b961f4b-628d-4dbd-8504-7b4c0488ac1d") {
        frame.style.height = data.height + "px";
      }
    });
  })();
</script>
{% endblock %}
